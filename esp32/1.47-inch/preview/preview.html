<div id="mini-aquarium-preview">
  <style>
    #mini-aquarium-preview .mini-display { display:block; width:100%; max-width:640px; height:auto; image-rendering:pixelated; margin:16px auto; }
    #mini-aquarium-preview .mini-native { max-width:320px; }
    #mini-aquarium-preview .mini-info { color:var(--muted-foreground); }
  </style>
  <div class="viz-row">
    <span>ESP32-S3 · 1.47-inch · 320 × 172</span>
    <span class="text-small mini-info" data-status aria-live="polite">Browser simulation</span>
  </div>
  <canvas class="mini-display cursor-interaction" width="320" height="172" role="img" aria-label="Animated miniature ASCII aquarium with three colored creatures, swaying plants, and bubbles. Tap the water to show touch controls."></canvas>
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-action="pause">Pause</button>
    <button class="btn" type="button" data-action="reset">New world</button>
    <button class="btn" type="button" data-action="settings">Settings</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-native><span class="form-check-label">Native pixels</span></label>
  </div>
  <div class="viz-controls" data-network-demo hidden>
    <span class="text-small mini-info">Wi-Fi and update simulation</span>
    <button class="btn" type="button" data-action="connect" hidden>Connect demo home Wi-Fi</button>
    <label class="form-label">Update test<select class="form-select" data-scenario><option value="success">Successful update</option><option value="bad-download">Damaged download</option><option value="bad-boot">Failed restart</option></select></label>
  </div>
  <script src="fish-art.js"></script>
  <script src="font.js"></script>
  <script src="ocean.js"></script>
  <script src="network.js"></script>
  <script>
    (() => {
      const root = document.getElementById('mini-aquarium-preview');
      const canvas = root.querySelector('canvas'), ctx = canvas.getContext('2d');
      const api = globalThis.MiniAquarium;
      let seed = 147, ocean = new api.MiniOcean(globalThis.AsciiquariumSprites, seed);
      const network = new globalThis.MiniNetwork.MiniNetwork();
      const pause = root.querySelector('[data-action="pause"]');
      const status = root.querySelector('[data-status]');
      let controlsUntil = 8, last = 0, elapsed = 0;
      function draw() {
        if(network.screen==='ocean') api.render(ctx, ocean, globalThis.MiniFont);
        else globalThis.MiniNetwork.draw(ctx,network,globalThis.MiniFont);
        root.querySelector('[data-network-demo]').hidden=network.screen==='ocean';
        root.querySelector('[data-action="connect"]').hidden=network.screen!=='setup';
        const nextStatus=network.screen==='ocean'?(ocean.paused?'Paused · browser simulation':'Browser simulation'):'Simulated · '+network.message;
        if(status.textContent!==nextStatus)status.textContent=nextStatus;
      }
      function sync() {
        pause.textContent = ocean.paused ? 'Resume' : 'Pause';
        pause.setAttribute('aria-pressed', String(ocean.paused));
        status.textContent = ocean.paused ? 'Paused · browser simulation' : 'Browser simulation';
        draw();
      }
      function reset() { ocean = new api.MiniOcean(globalThis.AsciiquariumSprites, ++seed); controlsUntil = elapsed + 8; sync(); }
      function toggle() { ocean.paused = !ocean.paused; controlsUntil = elapsed + 8; ocean.controls = true; sync(); }
      pause.addEventListener('click', toggle);
      root.querySelector('[data-action="reset"]').addEventListener('click', reset);
      root.querySelector('[data-action="settings"]').addEventListener('click',()=>{network.open();sync();});
      root.querySelector('[data-action="connect"]').addEventListener('click',()=>{network.connect();sync();});
      root.querySelector('[data-scenario]').addEventListener('change',e=>{network.scenario=e.target.value;});
      root.querySelector('[data-native]').addEventListener('change', e => canvas.classList.toggle('mini-native', e.target.checked));
      canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * api.W / rect.width, y = (e.clientY - rect.top) * api.H / rect.height;
        if(network.screen!=='ocean'){network.action(x,y);sync();}
        else if (ocean.controls && y >= 140) { if (x < 107) toggle(); else if(x<214) reset(); else {network.open();sync();} }
        else { ocean.controls = true; controlsUntil = elapsed + 8; sync(); }
      });
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) ocean.paused = true;
      function frame(now) {
        const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
        last = now;
        if (!document.hidden) { elapsed += dt; ocean.step(dt); network.step(dt); ocean.controls = ocean.paused || elapsed < controlsUntil; draw(); }
        requestAnimationFrame(frame);
      }
      // Exposed read-only snapshots let the preview checks verify real interaction.
      globalThis.miniPreview = {snapshot: () => ({time:ocean.time,paused:ocean.paused,fish:ocean.fish.length,seed:ocean.seed,controls:ocean.controls,network:{...network}}), reset};
      sync(); requestAnimationFrame(frame);
    })();
  </script>
</div>

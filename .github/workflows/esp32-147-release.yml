name: Prepare ESP32 1.47 release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable firmware version (X.Y.Z)'
        required: true
      publish:
        description: 'Publish the tested build and promote its wireless update manifest'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: esp32-147-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e 'if(!/^\d{1,5}\.\d{1,5}\.\d{1,5}$/.test(process.env.VERSION)||process.env.VERSION.split(".").some(n=>Number(n)>65535))process.exit(1)'
          printf '%s' "$VERSION" > esp32/1.47-inch/firmware/release-version.txt
      - run: node esp32/1.47-inch/preview/check.mjs && node esp32/1.47-inch/preview/network-check.mjs
      - run: node esp32/1.47-inch/tools/generate-assets.mjs --check
      - run: gcc -std=c11 -Wall -Wextra -Werror esp32/1.47-inch/tools/policy-check.c -o /tmp/policy-check && /tmp/policy-check
      - run: gcc -std=c11 -Wall -Wextra -Werror esp32/1.47-inch/tools/touch-check.c -o /tmp/touch-check && /tmp/touch-check
      - run: gcc -std=c11 -Wall -Wextra -Werror esp32/1.47-inch/tools/geometry-check.c -lm -o /tmp/geometry-check && /tmp/geometry-check
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: esp32/1.47-inch/firmware
          command: idf.py -DPROJECT_VER=$(cat release-version.txt) build && idf.py merge-bin -o aquarium-usb.bin
      - name: Package the board-specific update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          cp esp32/1.47-inch/firmware/build/ascii_genesis_147.bin release/ascii-genesis-147.bin
          cp esp32/1.47-inch/firmware/build/aquarium-usb.bin release/aquarium-usb.bin
          node esp32/1.47-inch/tools/make-manifest.mjs "$VERSION" release/ascii-genesis-147.bin release/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-147-${{ inputs.version }}
          path: release/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32-147-${{ inputs.version }}
          path: release
      - name: Publish immutable version, then promote the ESP32 channel
        run: |
          tag="esp32-147-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already exists. Use a new version number.'
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "ESP32 1.47-inch v$VERSION" --notes 'For Waveshare ESP32-S3-Touch-LCD-1.47 only. Use aquarium-usb.bin for first USB installation; wireless updates use ascii-genesis-147.bin.' --latest=false
          if ! gh release view esp32-147-stable >/dev/null 2>&1; then
            gh release create esp32-147-stable --target "$GITHUB_SHA" --title 'ESP32 1.47-inch wireless update channel' --notes 'The manifest points to the current tested ESP32 1.47-inch version. Raspberry Pi updates use a separate path.' --latest=false
          fi
          gh release upload esp32-147-stable release/manifest.json --clobber
